{% extends "main/admin_dashboard.html" %}
{% load static %}

{% block content %}
<style>
    .add-course-container {
        background: #f8f9fa;
        border-radius: 20px;
        box-shadow: 0 5px 25px rgba(0, 0, 0, 0.1);
        padding: 40px;
        transition: all 0.3s ease-in-out;
    }

    .add-course-container:hover {
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.15);
    }

    .form-label {
        font-weight: 600;
        color: #39034b;
    }

    .btn-custom {
        background-color: #e60493;
        color: white;
        font-weight: bold;
        transition: 0.3s ease;
    }

    .btn-custom:hover {
        background-color: #4c0564;
        color: white;
    }

    .heading {
        color: #39034b;
        font-weight: bold;
    }
</style>

<div class="container mt-5 col-md-6">
    <div class="add-course-container">
        <h3 class="mb-4 text-center heading">Add Course</h3>
        
        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-success">{{ message }}</div>
            {% endfor %}
        {% endif %}
        
        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}
            
            <div class="mb-3">
                <label for="name" class="form-label">Course Name</label>
                <input type="text" class="form-control" name="name" id="name" required placeholder="Enter course name">
            </div>

            <div class="mb-3">
                <label for="description" class="form-label">Description</label>
                <textarea class="form-control" name="description" id="description" rows="4" placeholder="Enter course description"></textarea>
            </div>

            <div class="mb-3">
                <label for="course_photo" class="form-label">Course Image</label>
                <input type="file" class="form-control" name="course_photo" id="course_photo">
            </div>

            <button type="submit" class="btn btn-custom w-100">Add Course</button>
        </form>
    </div>
</div>
{% endblock %}
