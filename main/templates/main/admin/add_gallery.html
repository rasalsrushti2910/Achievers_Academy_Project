{% extends "main/admin_dashboard.html" %}
{% load static %}

{% block content %}
<style>
    .add-course-container {
        background: #f8f9fa;
        border-radius: 20px;
        box-shadow: 0 5px 25px rgba(0, 0, 0, 0.1);
        padding: 40px;
        transition: all 0.3s ease-in-out;
    }

    .add-course-container:hover {
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.15);
    }

    .form-label {
        font-weight: 600;
        color: #39034b;
    }

    .btn-custom {
        background-color: #e60493;
        color: white;
        font-weight: bold;
        transition: 0.3s ease;
    }

    .btn-custom:hover {
        background-color: #4c0564;
        color: white;
    }

    .heading {
        color: #39034b;
        font-weight: bold;
    }
</style>

<div class="container mt-5 col-md-6">
    <div class="add-course-container">
        <h3 class="mb-4 text-center heading">Add Gallery Image</h3>

        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-success">{{ message }}</div>
            {% endfor %}
        {% endif %}

        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-custom w-100">Upload</button>
        </form>
    </div>
</div>
{% endblock %}
