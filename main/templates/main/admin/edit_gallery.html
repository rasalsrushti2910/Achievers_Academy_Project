{% extends "main/admin_dashboard.html" %}
{% load static %}

{% block content %}
<style>
    .edit-gallery-container {
        background-color: #f8f9fa;
        padding: 30px;
        border-radius: 20px;
        box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
        max-width: 600px;
        margin: 50px auto;
    }

    .edit-gallery-container h3 {
        color: #39034b;
        font-weight: bold;
        text-align: center;
        margin-bottom: 25px;
    }

    .btn-custom {
        background-color: #e60493;
        border: none;
        font-weight: bold;
        color: white;
    }

    .btn-custom:hover {
        background-color: #52045f;
        color: white;
    }
</style>

<div class="edit-gallery-container">
    <h3>Edit Gallery Image</h3>

    {% if messages %}
        {% for message in messages %}
            <div class="alert alert-info">{{ message }}</div>
        {% endfor %}
    {% endif %}

    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-custom w-100">Update</button>
    </form>
</div>
{% endblock %}
