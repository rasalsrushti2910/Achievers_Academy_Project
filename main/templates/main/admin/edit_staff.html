{% extends "main/admin_dashboard.html" %}
{% load static %}

{% block content %}
<style>
    .edit-course-container {
        background-color: #f8f9fa;
        padding: 30px;
        border-radius: 20px;
        box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
        max-width: 600px;
        margin: 50px auto;
    }

    .edit-course-container h3 {
        color: #39034b;
        font-weight: bold;
        text-align: center;
        margin-bottom: 25px;
    }

    .btn-custom {
        background-color: #e60493;
        border: none;
        font-weight: bold;
        color: white;
    }

    .btn-custom:hover {
        background-color: #52045f;
        color: white;
    }

    .form-label {
        font-weight: 500;
    }

    input, select, textarea {
        border-radius: 8px !important;
    }
</style>

<div class="edit-course-container">
    <h3>Edit Staff</h3>

    {% if messages %}
        {% for message in messages %}
            <div class="alert alert-success">{{ message }}</div>
        {% endfor %}
    {% endif %}

    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        <div class="mb-3">
            <label for="id_staff_name" class="form-label">Staff Name</label>
            {{ form.staff_name }}
        </div>
        <div class="mb-3">
            <label for="id_staff_photo" class="form-label">Staff Photo</label>
            <br>
            {{ form.staff_photo }}
            
        </div>
        <div class="mb-3">
            <label for="id_course" class="form-label">Course</label>
            {{ form.course }}
        </div>
        <button type="submit" class="btn btn-custom w-100">Update Staff</button>
    </form>
</div>
{% endblock %}
