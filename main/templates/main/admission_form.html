{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <!-- <meta charset="UTF-8"> -->
     <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admission Form - Achievers Academy</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(to right, #f0ecf5, #dcd6e6);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .container {
            max-width: 1000px;
            background: white;
            padding: 50px 40px;
            margin-top: 50px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
        }

        h2 {
            font-weight: 700;
            color: #39034b;
        }

        label {
            font-weight: 600;
            color: #39034b;
        }

        .form-control,
        .form-select {
            border-radius: 12px;
            border: 1px solid #ccc;
            transition: border-color 0.3s ease;
        }

        .form-control:focus,
        .form-select:focus {
            border-color: #39034b;
            box-shadow: 0 0 8px rgba(57, 3, 75, 0.2);
        }

        textarea {
            resize: none;
        }

        button.btn-success {
            background-color: #39034b;
            border-color: #000000;
            font-weight: 600;
            padding: 10px 25px;
            border-radius: 12px;
        }

        button.btn-success:hover,
        .btn-success:hover {
            background-color: #4f0566;
            border-color: #000000;
        }

        .btn-success i {
            margin-right: 6px;
        }

        .btn-secondary {
            border-radius: 12px;
            padding: 10px 25px;
        }

        .alert {
            font-weight: 500;
        }
        

    </style>
</head>
<body>
<div class="container">
    <h2 class="text-center mb-4"><i class="fas fa-user-plus me-2"></i>Admission Form</h2>

    <form method="post" onsubmit="return confirmSubmit();">
        {% csrf_token %}
        <div class="row mb-3">
            <div class="col-md-6">
                <label class="form-label">Full Name</label>
                <input type="text" name="name" class="form-control" required>
            </div>
            <div class="col-md-6">
                <label class="form-label">Mobile Number</label>
                <!-- <input type="text" name="phone" class="form-control" required> -->
                <input type="text" name="phone" class="form-control" required 
                    pattern="[6-9]\d{9}" 
                    inputmode="numeric"
                    maxlength="10" 
                    title="Enter a valid 10-digit mobile number">

            </div>
        </div>

        <div class="row mb-3">
            <div class="col-md-6">
                <label class="form-label">Email Address</label>
                <input type="email" name="email" class="form-control">
            </div>
            <div class="col-md-6">
                <label class="form-label">Select Course</label>
                <select name="course" class="form-select" required>
                    <option value="">-- Select Course --</option>
                    <option>English Communication</option>
                    <option>Japanese Language</option>
                    <option>German Language</option>
                    <option>Competitive Exam (Grammar)</option>
                </select>
            </div>
        </div>

        <div class="row mb-3">
            <div class="col-md-6">
                <label class="form-label">State</label>
                <select id="state" name="state" class="form-select" required>
                    <option value="">-- Select State --</option>
                    <option>Maharashtra</option>
                    <option>Gujarat</option>
                    <option>Karnataka</option>
                    <option>Tamil Nadu</option>
                    <option>Uttar Pradesh</option>
                    <option>West Bengal</option>
                    <option>Delhi</option>
                    <option>Rajasthan</option>
                    <option>Punjab</option>
                    <option>Madhya Pradesh</option>
                </select>
            </div>

            <div class="col-md-6">
                <label class="form-label">District</label>
                <select id="district" name="district" class="form-select" required>
                    <option value="">-- Select District --</option>
                </select>
            </div>
        </div>

        <div class="row mb-3">
            <div class="col-md-6">
                <label class="form-label">Taluka / Subdistrict</label>
                <select id="subdistrict" name="subdistrict" class="form-select" required>
                    <option value="">-- Select Subdistrict --</option>
                </select>
            </div>
            <div class="col-md-3">
                <label class="form-label">City</label>
                <input type="text" name="city" class="form-control" required>
            </div>
            <div class="col-md-3">
                <label class="form-label">Pincode</label>
                <!-- <input type="text" name="pincode" class="form-control" required> -->
                <input type="text" name="pincode" class="form-control" required 
                    pattern="\d{6}" 
                    maxlength="6" 
                    inputmode="numeric"
                    title="Enter a 6-digit valid pincode" >

            </div>
        </div>

        <div class="mb-3">
            <label class="form-label">Message (Optional)</label>
            <textarea name="message" class="form-control" rows="3"></textarea>
        </div>

        <div class="text-center">
            <button class="btn btn-success px-4"><i class="fas fa-paper-plane"></i>Submit</button>
            <a href="{% url 'home' %}" class="btn btn-secondary px-4"><i class="fas fa-arrow-left"></i> Back</a>
        </div>
    </form>
</div>

document.getElementById('state').addEventListener('change', function () {
    const state = this.value;
    const districts = Object.keys(data[state] || {});
    const districtSelect = document.getElementById('district');
    const subdistrictSelect = document.getElementById('subdistrict');

    districtSelect.innerHTML = '<option value="">-- Select District --</option>';
    subdistrictSelect.innerHTML = '<option value="">-- Select Subdistrict --</option>';

    districts.forEach(d => {
        districtSelect.innerHTML += `<option value="${d}">${d}</option>`;
    });
});

document.getElementById('district').addEventListener('change', function () {
    const state = document.getElementById('state').value;
    const district = this.value;
    const subdistricts = data[state]?.[district] || [];
    const subdistrictSelect = document.getElementById('subdistrict');

    subdistrictSelect.innerHTML = '<option value="">-- Select Subdistrict --</option>';
    subdistricts.forEach(sd => {
        subdistrictSelect.innerHTML += `<option value="${sd}">${sd}</option>`;
    });
});

function confirmSubmit() {
    return confirm("✅ Your admission form has been submitted successfully!");
}
</script>

</body>
</html>
