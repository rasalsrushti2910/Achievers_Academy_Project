{% extends "main/student_dashboard.html" %}
{% load static %}

{% block content %}

<style>
    .view-features-container {
        background-color: #f8f9fa;
        padding: 40px 30px;
        border-radius: 20px;
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.12);
    }

    .heading {
        color: #39034b;
        font-weight: 700;
        font-size: 2.2rem;
        margin-bottom: 35px;
        text-shadow: 1px 1px 2px #ddd;
    }

    .card {
        border: none;
        border-radius: 20px;
        background-color: white;
        box-shadow: 0 6px 20px rgba(145, 94, 255, 0.1);
        transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .card:hover {
        transform: scale(1.03);
        /* box-shadow: 0 10px 30px rgba(145, 94, 255, 0.2); */
    }

    .card-body {
        padding: 25px;
    }

    .card-title {
        font-size: 1.3rem;
        font-weight: 600;
        color: #ea149c;
        display: flex;
        align-items: center;
    }

    .card-title i {
        margin-right: 10px;
        color: #d00880;
    }

    .card-text {
        color: #444;
        font-size: 1rem;
        line-height: 1.6;
        margin-top: 10px;
    }

    .alert-warning {
        border-radius: 15px;
        font-size: 1.1rem;
    }
</style>

<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

<div class="container mt-5 view-features-container">
    <h2 class="text-center heading"> Our Academy Features</h2>
    <div class="row">
        {% for feature in features %}
        <div class="col-md-6 mb-4">
            <div class="card">
                <div class="card-body">
                    <h5 class="card-title">
                        <i class="fas fa-star"></i> {{ feature.title }}
                    </h5>
                    <p class="card-text">{{ feature.description }}</p>
                </div>
            </div>
        </div>
        {% empty %}
        <div class="col-12">
            <div class="alert alert-warning text-center">
                🚫 No academy features found.
            </div>
        </div>
        {% endfor %}
    </div>
</div>

{% endblock %}
