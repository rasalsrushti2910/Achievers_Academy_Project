{% extends "main/student_dashboard.html" %}
{% load static %}

{% block content %}
<style>
    .syllabus-container {
        background-color: #f8f9fa;
        padding: 40px;
        border-radius: 20px;
        box-shadow: 0 5px 30px rgba(0, 0, 0, 0.1);
    }

    .heading {
        color: #39034b;
        font-weight: bold;
        margin-bottom: 40px;
        text-align: center;
        font-size: 32px;
    }

    .syllabus-grid {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 30px;
    }

    .card {
        width: 240px;
        border: none;
        border-radius: 20px;
        overflow: hidden;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        transition: transform 0.3s ease, box-shadow 0.3s ease;
        background-color: white;
    }

    .card:hover {
        transform: translateY(-8px);
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
    }

    .card-header {
        background: linear-gradient(135deg, #6a0572, #39034b);
        color: white;
        padding: 15px;
        font-weight: 600;
        text-align: center;
        font-size: 18px;
    }

    .card-body {
        padding: 20px;
        text-align: center;
    }

    .pdf-link a {
        display: inline-block;
        color: #e409ad;
        font-weight: 500;
        text-decoration: none;
        padding: 8px 16px;
        border-radius: 10px;
        background-color: #eef1f6;
        transition: background 0.3s, color 0.3s;
    }

    .pdf-link a:hover {
        background-color: #e409ad;
        color: #fff;
        text-decoration: none;
    }

    .no-data {
        text-align: center;
        font-style: italic;
        color: #999;
        font-size: 18px;
        margin-top: 30px;
    }
</style>

<div class="container syllabus-container mt-5">
    <h2 class="heading"> Syllabus Details</h2>

    {% if syllabus_entries %}
    <div class="syllabus-grid">
        {% for syllabus in syllabus_entries %}
        <div class="card">
            <div class="card-header">
                {{ syllabus.course.name }}
            </div>
            <div class="card-body">
                <p class="pdf-link">
                    <a href="{{ syllabus.syllabus_pdf.url }}" target="_blank">View PDF</a>
                </p>
            </div>
        </div>
        {% endfor %}
    </div>
    {% else %}
    <p class="no-data">No syllabus found.</p>
    {% endif %}
</div>
{% endblock %}
