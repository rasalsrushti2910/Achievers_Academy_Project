{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <!-- <meta charset="UTF-8"> -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f9;
            color: #333;
        }

        h1 {
            text-align: center;
            padding: 20px;
            background: linear-gradient(to right, #39034b, #e60493);
            color: white;
            font-size: 28px;
            letter-spacing: 1px;
        }

        .sidebar {
            height: 100vh;
            width: 240px;
            position: fixed;
            background: linear-gradient(to right, #39034b, #e60493);
            padding-top: 20px;
            box-shadow: 2px 0 5px rgba(0,0,0,0.2);
            overflow-y: auto;
        }

        .sidebar h5 {
            color: #fff;
            text-align: center;
            margin-bottom: 20px;
        }

        .sidebar a {
            display: block;
            padding: 14px 20px;
            color: white;
            text-decoration: none;
            font-size: 15px;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .sidebar a:hover {
            background-color: #1b161d;
            padding-left: 25px;
        }

        .main-content {
            margin-left: 240px;
            padding: 30px;
        }

        .dashboard-box {
            background: #fff;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 600px;
            margin: auto;
        }

        .dashboard-box h3 {
            color: #5c007a;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .dashboard-box p {
            font-size: 16px;
            color: #333;
        }

        .dashboard-box strong {
            color: #e60493;
        }

        footer {
            text-align: center;
            padding: 15px 0;
            background-color: #f1f1f1;
            color: #555;
            position: fixed;
            bottom: 0;
            width: 100%;
            border-top: 1px solid #ccc;
        }
        @media (max-width: 768px) {
    .sidebar {
        position: relative;
        width: 100%;
        height: auto;
        padding: 10px 0;
        text-align: center;
    }

    .sidebar a {
        padding: 10px;
        font-size: 14px;
        display: inline-block;
        width: auto;
        margin: 5px;
    }

    .main-content {
        margin-left: 0;
        padding: 15px;
    }

    .dashboard-box {
        padding: 20px;
    }

    h1 {
        font-size: 22px;
    }

    .sidebar h5 {
        font-size: 16px;
    }

    footer {
        position: relative;
    }
}
@media (max-width: 480px) {
    .sidebar a {
        display: block;
        width: 100%;
        margin: 0;
    }
}

    </style>
</head>
<body>

<div class="sidebar">
    <h5><i class="fas fa-user-graduate"></i> Student Panel</h5>
    <a href="/student_dashboard/"><i class="fas fa-home"></i> Dashboard</a>
    <a href="/view_courses/"><i class="fas fa-book"></i> Courses</a>
    <a href="/view_staff1/"><i class="fas fa-users"></i> Staff</a>
    <a href="/view_syllabus1/"><i class="fas fa-book-open"></i> Syllabus </a>
    <a href="/view_academy_features1/"><i class="fas fa-building-columns"></i> Academy Features </a>
    <a href="/student_login/"><i class="fas fa-sign-out-alt"></i> Logout</a>
</div>

<div class="main-content">
    <h1>Student Dashboard</h1>
    <hr>
    <!-- <div class="dashboard-box mt-5">
        <h3>Welcome, {{ student.admission.name }}</h3>
        <p><strong>Email:</strong> {{ student.email }}</p>
        <p><strong>Phone:</strong> {{ student.phone }}</p>
        <p><strong>Course:</strong> {{ student.course }}</p>
    </div>  -->
    {% block content %}

    {% endblock %}
</div>

<footer>
    &copy; 2025 Achievers Academy. All rights reserved.
</footer>

</body>
</html>
